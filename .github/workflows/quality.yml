name: quality

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/artificial_search
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_USER_EMAIL: demo@artificial-search.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
